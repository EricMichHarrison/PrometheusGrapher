; ===========================================================================
; Added while migrating this project onto a testable core/hal/ui/sim
; architecture (see README.md "Migrating an existing project" section).
; Neither of these two environments touches the cardputer_adv config
; above or needs any M5-specific library — they build lib/core + lib/ui
; (and src/sim for the second one) with a plain native toolchain.
; ===========================================================================

[env:test-native]
platform = native
build_flags = -std=c++17 -Wall
test_filter = test_native/*

[env:sim]
platform = native
build_flags = -std=c++17 -Wall -Isrc/sim
build_src_filter = +<sim/*>
; --serve needs -lws2_32 on Windows only (for Winsock). Added
; conditionally by this script rather than a build_flags literal,
; since -lws2_32 doesn't exist on Linux/macOS.
extra_scripts = pre:scripts/link_winsock.py
