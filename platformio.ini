; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[PlatformIO]
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache

[env:cardputer_adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; Only build src/device/* for this target — src/sim/* is the
; native simulator (see [env:sim] below) and must not be compiled
; into the firmware.
build_src_filter = +<device/*> -<sim/*>
; upload_speed = 1500000
monitor_speed = 115200
; upload_port = COM4
; monitor_port = COM4
; monitor_rts = 0
; monitor_dtr = 0
lib_deps = 
	m5stack/M5Cardputer@^1.1.1
	m5stack/M5GFX
extra_scripts = build.py
platform_packages =
	espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
